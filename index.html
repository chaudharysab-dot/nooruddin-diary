<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2d57">
<title>Nooruddin Daily Diary FINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9eef4;color:#0b2d57;font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#e8eef5;color:#0b2d57}
button:active{transform:translateY(1px)}
.top{position:sticky;top:0;z-index:10;background:#0b2d57;color:#fff;padding:13px 16px;box-shadow:0 2px 10px #0002}
.brand{font-weight:800;font-size:18px} .small{font-size:11px;opacity:.85;margin-top:2px}
.panel{background:#fff;padding:14px 16px}
h2{margin:0 0 10px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
label{font-size:15px;font-weight:700}
input,textarea{width:100%;margin-top:5px;padding:10px;font-size:15px;border:1px solid #c6d1de;border-radius:9px;outline:none}
textarea{min-height:64px;resize:vertical}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.subject{border:1px solid #d3dde8;background:#f7f9fb;border-radius:11px;padding:9px;margin:8px 0}
.subjectTop{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.notesEdit{margin-top:12px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.primary{background:#0b2d57;color:#fff} .gold{background:#efbd24} .danger{background:#fee0e0;color:#991b1b}
#status{font-size:14px;color:#356b3d;min-height:18px;margin-top:7px}
.previewArea{background:#dfe7ef;padding:16px}
.preview{max-width:640px;margin:auto;background:#fff;box-shadow:0 4px 18px #0002}
canvas{display:block;width:100%;height:auto}
.pages{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0 2px}
.pages button:disabled{opacity:.4}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">NOORUDDIN SCHOOL SYSTEM</div>
  <div class="small">DAILY DIARY APP • 9 SUBJECTS / PAGE • FINAL</div>
</header>

<section class="panel">
  <h2>Diary Details</h2>
  <div class="grid">
    <label>Class<input id="cls" value="Class 3"></label>
    <label>Date<input id="date" type="date"></label>
    <label>Day<input id="day" value=""></label>
  </div>

  <div class="sectionHead">
    <h2 style="margin:0">Subjects</h2>
    <button id="add" class="gold" type="button">＋ Add Subject</button>
  </div>
  <div id="subjects"></div>

  <label class="notesEdit">Notes / Important Message
    <textarea id="notes" placeholder="Write a note for parents..."></textarea>
  </label>

  <div class="actions">
    <button id="preview" type="button">Preview</button>
    <button id="download" class="primary" type="button">Download Diary</button>
    <button id="all" type="button">Download All Pages</button>
    <button id="clear" class="danger" type="button">Clear</button>
  </div>
  <div id="status"></div>
</section>

<section class="previewArea">
  <div class="preview"><canvas id="canvas" width="1024" height="1536"></canvas></div>
  <div class="pages">
    <button id="prev" type="button">← Previous</button>
    <b id="info">Page 1 of 1</b>
    <button id="next" type="button">Next →</button>
  </div>
</section>

const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
let page=0;
let subjects=[
 {name:"English",text:""},{name:"Mathematics",text:""},{name:"Urdu",text:""},
 {name:"Science",text:""},{name:"Islamiat",text:""},{name:"Computer",text:""},
 {name:"Social Studies",text:""},{name:"General Knowledge",text:""},{name:"Homework",text:""}
];
const notesByPage=[""];
const $=id=>document.getElementById(id);

function today(){
 const d=new Date(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
 $("date").value=`${d.getFullYear()}-${m}-${day}`;
 $("day").value=d.toLocaleDateString("en-US",{weekday:"long"});
}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function pageCount(){return Math.max(1,Math.ceil(subjects.length/9))}
function ensureNotes(){while(notesByPage.length<pageCount())notesByPage.push("");}
function renderEditor(){
 const box=$("subjects");box.innerHTML="";
 subjects.forEach((s,i)=>{
   const d=document.createElement("div");d.className="subject";
   d.innerHTML=`<div class="subjectTop">
      <label>Subject name<input class="name" value="${esc(s.name)}"></label>
      <button type="button" class="danger rm">Remove</button>
   </div>
   <label>Diary / Homework<textarea class="txt" placeholder="Write today's work...">${esc(s.text)}</textarea></label>`;
   d.querySelector(".name").oninput=e=>{s.name=e.target.value;draw()};
   d.querySelector(".txt").oninput=e=>{s.text=e.target.value;draw()};
   d.querySelector(".rm").onclick=()=>{subjects.splice(i,1);page=Math.min(page,pageCount()-1);ensureNotes();renderEditor();draw()};
   box.appendChild(d);
 });
 ensureNotes();
 $("notes").value=notesByPage[page]||"";
 $("notes").oninput=()=>{notesByPage[page]=$("notes").value;draw()};
 draw();
}
function wrap(text,max,font){
 ctx.font=font;let out=[];
 String(text||"").split("\n").forEach(p=>{
   let words=p.trim().split(/\s+/).filter(Boolean),line="";
   if(!words.length){out.push("");return}
   words.forEach(word=>{
     const z=line?line+" "+word:word;
     if(ctx.measureText(z).width<=max)line=z;
     else{if(line)out.push(line);line=word}
   });
   if(line)out.push(line);
 });
 return out;
}
function rounded(x,y,w,h,r,fill,stroke){
 ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=2;
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke();
}
function infoBox(x,y,w,label,value){
 rounded(x,y,w,70,11,"rgba(255,255,255,.96)","#0b2d57");
 ctx.fillStyle="#0b2d57";ctx.font="700 21px Arial";ctx.textAlign="center";
 ctx.fillText(label.toUpperCase(),x+w/2,y+20);
 ctx.font="700 28px Arial";ctx.fillText(value||"________",x+w/2,y+50);
 ctx.textAlign="left";
}
function subjectBox(name,text,y){
 const labelX=44,labelW=190, boxX=244,boxW=736,h=68;
 ctx.fillStyle="#0b2d57";
 ctx.beginPath();ctx.roundRect(labelX,y+14,labelW,36,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="700 20px Arial";ctx.textAlign="center";
 ctx.fillText((name||"SUBJECT").toUpperCase(),labelX+labelW/2,y+37);
 ctx.textAlign="left";
 rounded(boxX,y,boxW,h,9,"rgba(255,255,255,.97)","#0b2d57");
 const val=(text||"").trim();
 if(val){
   let size=35,lines=wrap(val,boxW-26,`700 ${size}px Arial`),max=2;
   while(lines.length>max&&size>32){
     size--;lines=wrap(val,boxW-30,`600 ${size}px Arial`)
   }
   ctx.fillStyle="#203a5b";
   ctx.font=`700 ${size}px Arial`;
   ctx.textAlign="center";
   const visible=lines.slice(0,max);
   const lineGap=size+8;
   const totalH=visible.length*size+(visible.length-1)*6;
   const startY=y+(h-totalH)/2+size*0.78;
   visible.forEach((line,j)=>ctx.fillText(line,boxX+boxW/2,startY+j*lineGap));
   ctx.textAlign="left";
 }
}
function noteBox(text){
 const x=44,y=1260,w=936,h=112;
 rounded(x,y,w,h,11,"rgba(255,255,255,.97)","#0b2d57");
 ctx.fillStyle="#0b2d57";ctx.beginPath();ctx.roundRect(x,y,150,38,8);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="700 21px Arial";ctx.textAlign="center";ctx.fillText("NOTES",x+75,y+24);ctx.textAlign="left";
 const val=(text||"").trim();
 if(val){
   ctx.fillStyle="#203a5b";ctx.font="400 22px Arial";
   wrap(val,w-34,"400 22px Arial").slice(0,3).forEach((line,j)=>ctx.fillText(line,x+17,y+63+j*28));
 }
}
function draw(){
 ctx.clearRect(0,0,1024,1536);
 if(bg.complete)ctx.drawImage(bg,0,0,1024,1536);

 // Clean, stable information area on top of the diary body.
 infoBox(44,485,286,"Class",$("cls").value.trim());
 let date=""; if($("date").value){let [y,m,d]=$("date").value.split("-");date=`${d}/${m}/${y}`}
 infoBox(369,485,286,"Date",date);
 infoBox(694,485,286,"Day",$("day").value.trim());

 const list=subjects.slice(page*9,page*9+9);
 list.forEach((s,i)=>subjectBox(s.name,s.text,575+i*74));
 noteBox(notesByPage[page]||"");

 $("info").textContent=`Page ${page+1} of ${pageCount()}`;
 $("prev").disabled=page===0;$("next").disabled=page>=pageCount()-1;
}
$("add").onclick=()=>{subjects.push({name:"New Subject",text:""});renderEditor();$("status").textContent="Subject added."};
$("preview").onclick=()=>{draw();$("status").textContent="Preview updated."};
$("prev").onclick=()=>{if(page>0){page--;renderEditor()}};
$("next").onclick=()=>{if(page<pageCount()-1){page++;renderEditor()}};
$("clear").onclick=()=>{subjects.forEach(s=>s.text="");for(let i=0;i<notesByPage.length;i++)notesByPage[i]="";renderEditor();$("status").textContent="Diary entries cleared."};
$("cls").oninput=draw;$("day").oninput=draw;$("date").onchange=draw;
function downloadPage(i){
 page=i;draw();
 const a=document.createElement("a");
 const c=($("cls").value||"Class").replace(/[^a-z0-9_-]+/gi,"-"),d=$("date").value||"date";
 a.download=`${c}-Daily-Diary-${d}-Page-${i+1}.png`;
 a.href=canvas.toDataURL("image/png");a.click();
}
$("download").onclick=()=>{downloadPage(page);$("status").textContent="Diary downloaded."};
$("all").onclick=()=>{
 const old=page;
 for(let i=0;i<pageCount();i++)downloadPage(i);
 page=old;draw();$("status").textContent="All pages downloaded.";
};
today();bg.onload=draw;renderEditor();
</script>
